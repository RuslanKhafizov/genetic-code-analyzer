            flex-shrink: 0; overflow-y: auto;
        }

            padding-bottom: 1rem; 
            border-bottom: 1px solid #e5e7eb; 
        }
        .control-panel-section:last-of-type { border-bottom: none; }

        .sub-row-grid {

            gap: 1.5px; height: 100%; width: 100%;
        }
        .sub-row-item { 
            display: flex; flex-direction: row; justify-content: stretch; align-items: stretch; 
            border: 1px solid #d1d5db; 
            border-radius: 2px; overflow: hidden; text-align: center;
            cursor: pointer;
        }
        .sub-row-item.selected-for-summing {
            outline: 2px solid #0d6efd; 
            outline-offset: -1px; 
            box-shadow: 0 0 6px rgba(13, 110, 253, 0.6);
        }
        .sub-row-codon-part {
            font-family: monospace; font-size: 0.85rem; font-weight: 500; 
            padding: 1px 3px; flex-basis: 40%; 
            display: flex; align-items: center; justify-content: center;
            border-right: 1px solid #e0e0e0; 
        }
        .sub-row-info-part {
            padding: 1px 2px; flex-basis: 60%;

            justify-content: space-between;
            align-items: center;
        }

            display: flex; flex-direction: column; align-items: center; justify-content: center;
            flex-grow: 1; line-height: 1.1;

            font-family: sans-serif; font-weight: bold; font-size: 0.8rem;
        }
        .mass-value {

        }
        .nucleon-value {
            font-family: monospace; font-size: 0.65rem; color: #555;

        .order-part.active { background-color: #007bff; color: white; font-weight: bold; }

            font-size: 0.75rem; font-weight: 700; color: #16a34a; 
        }
        .sum-value-match-diff {
            font-size: 0.75rem; font-weight: 700; color: #e11d48;

            background-color: #4b5563;

            return { name, id: `transl_table_${id}`, table, type, defaultParams };

                Object.values(orbitMembers).forEach(member => processedOrders.add(member));
                orbits.push({ representative: p_str, orders: orbitMembers });
            }

        const calculateSums_New = (selectedCodons, customKeys, codeTable, activeCodeId) => {
            let totalSideChainMass = 0, totalBackboneMass = 0, totalProtons = 0, totalNeutrons = 0, totalFullMass = 0;
            const aminoAcidParams = customKeys.AMINO_ACIDS;

            selectedCodons.forEach(codon => {
                const aa = codeTable[codon]; if (!aa) return;
                let currentSideChainMass = 0, currentProtons = 0, currentNeutrons = 0, currentBackboneMass = 0;
                
                if (aa === 'STOP') {
                    const customStop = customKeys.useIndividualStops ? (customKeys.STOP[codon] || {}) : (customKeys.STOP.ALL || {});
                    currentSideChainMass = customStop.sideChainMass || 0;
                    currentProtons = customStop.protons || 0;
                    currentNeutrons = customStop.neutrons || 0;
                    currentBackboneMass = customStop.backboneMass || 0;
                } else {
                    const params = aminoAcidParams[aa];
                    if (params) {
                        currentSideChainMass = params.sideChainMass;
                        currentBackboneMass = params.backboneMass;
                        currentProtons = params.protons;
                        currentNeutrons = params.neutrons;
                    }
                    
                    if (codon === 'ATG') {
                       currentSideChainMass += customKeys.START.sideChainMass || 0;
                       currentProtons += customKeys.START.protons || 0;
                       currentNeutrons += customKeys.START.neutrons || 0;
                       
                       // MODIFIED LOGIC: Use modifier only if not null
                       if (customKeys.START.backboneMass !== null) {
                           currentBackboneMass = customKeys.START.backboneMass;
                       }
                    }
                }
                totalSideChainMass += currentSideChainMass;
                totalBackboneMass += currentBackboneMass;
                totalProtons += currentProtons;
                totalNeutrons += currentNeutrons;
                totalFullMass += (currentSideChainMass + currentBackboneMass);
            });
            return { fullMass: totalFullMass, sideChainMass: totalSideChainMass, backboneMass: totalBackboneMass, protons: totalProtons, neutrons: totalNeutrons };
        };
        
        const calculateDecompositionSums = (selectedCodons, customKeys, codeTable, activeCodeId) => {
            const emptySet = () => ({ count: 0, fullMass: 0, sideChainMass: 0, backboneMass: 0, protons: 0, neutrons: 0 });
            const sums = { T: emptySet(), C: emptySet(), G: emptySet(), A: emptySet() };

            selectedCodons.forEach(codon => {
                const codonProps = calculateSums_New(new Set([codon]), customKeys, codeTable, activeCodeId);
                for (const base of codon.split('')) {
                    if (sums[base]) {
                        sums[base].count++;
                        sums[base].fullMass += codonProps.fullMass;
                        sums[base].sideChainMass += codonProps.sideChainMass;
                        sums[base].backboneMass += codonProps.backboneMass;
                        sums[base].protons += codonProps.protons;
                        sums[base].neutrons += codonProps.neutrons;
                    }
                }
            });
            return sums;
        };
        
        const exportData = (structure, customKeys, activeGeneticCode, tabName, allDemoSetSums, selectedCodons) => {
             // 1. Build Metadata Header String
             let metadataHeader = "";
             metadataHeader += `Genetic Code:;${activeGeneticCode.name}\n`;
             
             // Row 2: Start Params (ATG Modifiers)
             const start = customKeys.START;
             const bVal = start.backboneMass !== null ? start.backboneMass : "Std";
             metadataHeader += `Start Key (Mod):;S=${start.sideChainMass}, B=${bVal}, P=${start.protons}, N=${start.neutrons}\n`;
             
             // Row 3: Stop Params
             let stopStr = "";
             if (customKeys.useIndividualStops) {
                 ['TAA', 'TAG', 'TGA'].forEach(stop => {
                     const s = customKeys.STOP[stop] || {};

                 });
             } else {
                 const s = customKeys.STOP.ALL || {};
                 stopStr = `All Stops:[S=${s.sideChainMass || 0}, B=${s.backboneMass || 0}, P=${s.protons || 0}, N=${s.neutrons || 0}]`;
             }
             metadataHeader += `Stop Key (Mod):;${stopStr}\n`;
             metadataHeader += `\n`;

             // 2. Build Table Content
             let csvContent = metadataHeader;
             csvContent += "ID (Twin ID);Group Name;Group size;Total Mass (T);Math (T);Side Chain (S);Math (S);Backbone (B);Math (B);Protons (P);Math (P);Neutrons (N);Math (N);Delta (P-N);Math (Delta);Cross-Set Equalities\n";
             
             const valueMap = new Map();
             const addValue = (val, id, symmetryId, level, type) => {
                if (!valueMap.has(val)) valueMap.set(val, []);
                valueMap.get(val).push({ id, symmetryId, level, type });
             };

             const flattenedSets = [];
             structure.forEach(section => {
                 const traverse = (groups) => groups.forEach(g => g.sets.forEach(s => {
                     const mainTwinId = s.pair ? (s.pair.symmetryId || s.pair.id) : null;
                     const mainWrapper = { ...s, _twinRef: mainTwinId };
                     flattenedSets.push(mainWrapper);

                     if(s.pair) {

                 }));
                 if (section.isOctetContainer) { traverse(section.octetI.groups); traverse(section.octetII.groups); }
                 else { traverse(section.groups); }
             });

             flattenedSets.forEach(set => {
                 const sum = calculateSums_New(set.getCodons(), customKeys, activeGeneticCode.table, activeGeneticCode.id);
                 const level = set.getCodons().size;
                 const sId = set.symmetryId || set.id; 
                 addValue(sum.fullMass, set.id, sId, level, 'fullMass');
                 addValue(sum.sideChainMass, set.id, sId, level, 'sideChainMass');
                 addValue(sum.protons, set.id, sId, level, 'protons');
                 addValue(sum.neutrons, set.id, sId, level, 'neutrons');
             });

             const getPlainTextPowers = (val) => {
                 const absValue = Math.abs(val);
                 if(absValue === 0) return "";
                 const factors = getPrimeFactorization(val); 
                 let results = [];

                 if (factors[37] && factors[2]) {
                      const p2 = Math.pow(2, factors[2]);
                      if (absValue === 37 * p2) results.push(`37*${p2}`);
                 } else if (factors[3] && factors[2]) {
                     const p3 = Math.pow(3, factors[3]);
                     const p2 = Math.pow(2, factors[2]);
                     if (absValue === p3 * p2) results.push(`${p3}*${p2}`);
                 } else if (factors[2] && Object.keys(factors).length === 1) {
                     results.push(`2^${factors[2]}`);
                 }

                 const forms = getPowerForms(val); 
                 forms.forEach(f => {
                     let clean = f.replace('=', '').replace('<sup>', '^').replace('</sup>', '');
                     if (!results.includes(clean)) results.push(clean);
                 });

                 return results.join(' | ');
             };

             const getDivisibilityString = (val) => {
                 if (val === 0) return "0";
                 const parts = [];
                 if (val % 37 === 0) parts.push(`37x${val/37}`);
                 
                 const powers = getPlainTextPowers(val);
                 if (powers) parts.push(powers);
                 
                 const sm = findSMRepresentation(val);
                 if (sm) parts.push(`${999}*${sm.m} + ${111}*${sm.n}`);
                 
                 return parts.join(" | ");
             };

             // --- CUSTOM SELECTION ROW LOGIC ---
             if (selectedCodons && selectedCodons.size > 0) {
                 const customSum = calculateSums_New(selectedCodons, customKeys, activeGeneticCode.table, activeGeneticCode.id);
                 
                 // Divisibility for custom row
                 const cDivT = getDivisibilityString(customSum.fullMass);
                 const cDivS = getDivisibilityString(customSum.sideChainMass);
                 const cDivB = getDivisibilityString(customSum.backboneMass);
                 const cDivP = getDivisibilityString(customSum.protons);
                 const cDivN = getDivisibilityString(customSum.neutrons);
                 const cDivD = getDivisibilityString(customSum.protons - customSum.neutrons);

                 // Cross-Set Equalities for custom row
                 const cMatchesByVal = {};
                 ['fullMass', 'protons', 'neutrons'].forEach(myType => {
                     const val = customSum[myType];
                     const typeCode = myType === 'fullMass' ? 'T' : (myType === 'protons' ? 'P' : 'N');
                     
                     const matches = valueMap.get(val);
                     if (matches) {
                         // Filter out self-matches (though custom ID won't match predefined IDs)
                         const valid = matches.filter(m => m.type !== myType); 
                         if (valid.length > 0) {
                             if (!cMatchesByVal[val]) cMatchesByVal[val] = [];
                             valid.forEach(m => {
                                 let otherCode = "";
                                 if(m.type==='fullMass') otherCode="T";
                                 if(m.type==='sideChainMass') otherCode="S";
                                 if(m.type==='protons') otherCode="P";
                                 if(m.type==='neutrons') otherCode="N";
                                 
                                 const desc = `${typeCode}=${otherCode}(ID ${m.symmetryId})`;
                                 if (!cMatchesByVal[val].includes(desc)) {
                                     cMatchesByVal[val].push(desc);
                                 }
                             });
                         }
                     }
                 });
                 const cCrossSetStr = Object.entries(cMatchesByVal).map(([val, descArr]) => {
                     return `${val}: ${descArr.join('; ')}`;
                 }).join(" | ");

                 const codonList = Array.from(selectedCodons).sort().join(" ");
                 const customRow = [
                     `"Custom Selection"`,
                     `"${codonList}"`,
                     selectedCodons.size,
                     customSum.fullMass, `"${cDivT}"`,
                     customSum.sideChainMass, `"${cDivS}"`,
                     customSum.backboneMass, `"${cDivB}"`,
                     customSum.protons, `"${cDivP}"`,
                     customSum.neutrons, `"${cDivN}"`,
                     customSum.protons - customSum.neutrons, `"${cDivD}"`,
                     `"${cCrossSetStr}"` 
                 ].join(";");
                 
                 csvContent += customRow + "\n";
             }
             // ----------------------------------

             const processSet = (set) => {
                 const codons = set.getCodons();
                 const sum = calculateSums_New(codons, customKeys, activeGeneticCode.table, activeGeneticCode.id);
                 
                 const symmetryId = set.symmetryId || set.id;
                 const twinId = set._twinRef ? ` (${set._twinRef})` : "";
                 const mergedId = `${symmetryId}${twinId}`;

                 const divT = getDivisibilityString(sum.fullMass);
                 const divS = getDivisibilityString(sum.sideChainMass);
                 const divB = getDivisibilityString(sum.backboneMass);
                 const divP = getDivisibilityString(sum.protons);
                 const divN = getDivisibilityString(sum.neutrons);
                 const divD = getDivisibilityString(sum.protons - sum.neutrons);
                 
                 const matchesByVal = {};

                 ['fullMass', 'protons', 'neutrons'].forEach(myType => {
                     const val = sum[myType];
                     const typeCode = myType === 'fullMass' ? 'T' : (myType === 'protons' ? 'P' : 'N');
                     
                     const matches = valueMap.get(val);
                     if (matches) {
                         const valid = matches.filter(m => m.type !== myType && m.id !== set.id);
                         if (valid.length > 0) {
                             if (!matchesByVal[val]) matchesByVal[val] = [];
                             
                             valid.forEach(m => {
                                 let otherCode = "";
                                 if(m.type==='fullMass') otherCode="T";
                                 if(m.type==='sideChainMass') otherCode="S";
                                 if(m.type==='protons') otherCode="P";
                                 if(m.type==='neutrons') otherCode="N";
                                 
                                 const desc = `${typeCode}=${otherCode}(ID ${m.symmetryId})`;
                                 if (!matchesByVal[val].includes(desc)) {
                                     matchesByVal[val].push(desc);
                                 }
                             });
                         }
                     }
                 });

                 const crossSetStr = Object.entries(matchesByVal).map(([val, descArr]) => {
                     return `${val}: ${descArr.join('; ')}`;
                 }).join(" | ");

                 const row = [
                     `"${mergedId}"`,
                     `"${set.label}"`,
                     codons.size,
                     sum.fullMass, `"${divT}"`,
                     sum.sideChainMass, `"${divS}"`,
                     sum.backboneMass, `"${divB}"`,
                     sum.protons, `"${divP}"`,
                     sum.neutrons, `"${divN}"`,
                     sum.protons - sum.neutrons, `"${divD}"`,
                     `"${crossSetStr}"` 
                 ].join(";");
                 csvContent += row + "\n";
             };

             flattenedSets.forEach(s => processSet(s));
             
             const blob = new Blob(["\uFEFF"+csvContent], { type: 'text/csv;charset=utf-8;' });
             const link = document.createElement("a");
             const url = URL.createObjectURL(blob);
             link.setAttribute("href", url);
             link.setAttribute("download", `${tabName}_Analysis.csv`);
             document.body.appendChild(link);
             link.click();
             document.body.removeChild(link);
        };


        // --- 2. REACT COMPONENTS & UTILITIES for ANALYSIS ---
        
        const UNIQUE_DIGIT_SEXTET = new Set([259, 296, 592, 629, 925, 962]);

        const getPrimeFactorization = (n) => {
            const factors = {}; let d = 2; let num = Math.abs(n); if (num < 2) return num === 1 ? {1:1} : {};
            while (d * d <= num) { while (num % d === 0) { factors[d] = (factors[d] || 0) + 1; num /= d; } d++; }
            if (num > 1) factors[num] = (factors[num] || 0) + 1;
            return factors;
        }

        const formatPrimeFactors = (factors) => {
            if (Object.keys(factors).length === 0) return '0'; if (factors[1]) return '1';
            return Object.entries(factors).map(([base, exp]) => exp > 1 ? `${base}<sup>${exp}</sup>` : base).join(' ⋅ ');
        }

        const formatPowers = (value, factors) => {
            const absValue = Math.abs(value); if (absValue < 2) return '-';
            if (factors[37] && factors[2]) { const p2 = Math.pow(2, factors[2]); if (absValue === 37 * p2) return `37 × ${p2}`; }
            if (factors[3] && factors[2]) { const p3 = Math.pow(3, factors[3]); const p2 = Math.pow(2, factors[2]); if (absValue === p3 * p2) return `${p3} × ${p2}`; }
            const p2 = factors[2] ? `2<sup>${factors[2]}</sup>` : null; if (p2 && Math.pow(2, factors[2]) === absValue) return p2;
            return '-';
        }

        const digitSum = (n_str) => n_str.split('').reduce((sum, digit) => sum + parseInt(digit, 10), 0);
        function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
        function gcd_two_or_more(arr) { if (arr.length === 0) return 0; let result = arr[0]; for (let i = 1; i < arr.length; i++) { result = gcd(result, arr[i]); } return result; }
        function getDivisors(n) { const divisors = []; for (let i = 1; i * i <= n; i++) { if (n % i === 0) { divisors.push(i); if (i * i !== n) divisors.push(n / i); } } return divisors.sort((a, b) => a - b); }

        function getPowerForms(n) {
            const absN = Math.abs(n);
            if (absN < 4) return [];
            const factors = getPrimeFactorization(absN);
            const exponents = Object.values(factors);
            if (exponents.length === 0) return [];

            const commonDivisor = gcd_two_or_more(exponents);
            if (commonDivisor < 2) return [];

            const divisors = getDivisors(commonDivisor).filter(d => d > 1);
            const forms = [];

            for (const d of divisors) {
                let newBase = 1;
                for (const [base, exp] of Object.entries(factors)) {
                    newBase *= Math.pow(parseInt(base), exp / d);
                }
                forms.push(`=${newBase}<sup>${d}</sup>`);
            }
            return forms;
        }

        function findSMRepresentation(value) {
            if (value <= 0) return null;
            const m = Math.floor(value / 999);
            const remainder = value % 999;
            if (remainder % 111 === 0) {
                const n = remainder / 111;
                return { m, n };
            }
            return null;
        }

        const RatioDisplay = ({ label, numerator, denominator }) => {
            if (denominator === 0) return (<div className="flex justify-between items-center"><span>{label}:</span><div><strong>N/A</strong></div></div>);
            const commonDivisor = gcd(Math.abs(numerator), Math.abs(denominator));
            const simpNum = Math.round(numerator / commonDivisor); const simpDenom = Math.round(denominator / commonDivisor);
            const decVal = (numerator / denominator).toFixed(4);
            return (<div className="flex justify-between items-center"><span>{label}:</span><div><strong>{`${simpNum}/${simpDenom}`}</strong><span className="ml-2 text-gray-500">({decVal})</span></div></div>);
        };
        
        const DivisibilityAnalysis = ({ value, showResult = false }) => {
            const tags = [];
            
            if (value !== 0 && value % 37 === 0) {
                const quotient = Math.round(value / 37);
                let resultString = showResult ? `=${quotient}` : '';
                resultString += getPowerForms(quotient).join('');
                tags.push(<span key="37" className="text-xs font-mono bg-green-100 text-green-700 px-2 py-0.5 rounded-full ml-1" dangerouslySetInnerHTML={{ __html: `/37${resultString}` }} />);
            }

            if (value !== 0 && value % 59 === 0) {
                const quotient = value / 59;
                let resultString = showResult ? `=${quotient}` : '';
                resultString += getPowerForms(quotient).join('');
                tags.push(<span key="59" className="text-xs font-mono bg-red-100 text-red-700 px-2 py-0.5 rounded-full ml-1" dangerouslySetInnerHTML={{ __html: ` /59${resultString}` }} />);
            }
            
            const powerForms = getPowerForms(value).join('');
            if (powerForms) {
                 tags.push(<span key="pow" className="text-xs font-mono bg-gray-200 px-2 py-0.5 rounded-full ml-1" dangerouslySetInnerHTML={{ __html: powerForms }}/>);
            }

            return tags.length > 0 ? <>{tags}</> : null;
        };

        const NumericalAnalysisSection = ({ label, value }) => {
            const primeFactors = getPrimeFactorization(value); const primeString = formatPrimeFactors(primeFactors); const powerString = formatPowers(value, primeFactors);
            const mod37Value = value % 37;
            const mod37String = (mod37Value === 0 && value !== 0) ? `${value} / 37 = ${value / 37} (≡ 0 mod 37)` : `${value} ≡ ${mod37Value} (mod 37)`;

            let smRep = null;
            if (value >= 0 && mod37Value === 0) {
                const n = Math.floor(value / 999); const m = value % 999;
                if (m % 37 === 0) {
                    const mStr = String(m).padStart(3, '0'); const q = m / 37; const s = digitSum(mStr);
                    const digitSumString = mStr.length < 2 ? s : `${mStr.split('').join('+')}=${s}`;
                    
                    const sm = findSMRepresentation(value);
                    const isPure999 = sm && sm.n === 0 && sm.m > 0;
                    
                    smRep = (<div className={`text-xs ${isPure999 ? 'text-green-600 font-bold' : ''}`}><span className="block">{value}={999}×{n}+{mStr}</span><span className="block">{mStr}/37={q}, digit-sum({mStr})={digitSumString}</span></div>);
                }
            }

            return (
                <div className="text-xs font-mono p-1.5 bg-gray-100 rounded mb-2">

                    <div className="grid grid-cols-[60px_1fr] gap-x-2">
                        <span>Prime:</span> <span dangerouslySetInnerHTML={{ __html: primeString }} />
                        <span>Powers:</span><span dangerouslySetInnerHTML={{ __html: powerString }} />
                        <span>mod 37:</span><span>{mod37String}</span>
                        <span>SM:</span> <div>{smRep || '—'}</div>
                    </div>
                </div>
            );
        };
        
        const SMAnalysisDisplay = ({ totalSums, delta }) => {
            const allSums = { ...totalSums, delta };
            const representations = [];
            const labels = {

        const SubRowItem = ({ codon, aminoAcid, style, isSelected, onCodonSelect, customKeys }) => {
            const { displayMass, protons, neutrons } = useMemo(() => {
                if (!aminoAcid) return { displayMass: 0, protons: 0, neutrons: 0 };
                let sc = 0, bb = 0, p = 0, n = 0;
                
                if (aminoAcid === 'STOP') {
                    const stopData = customKeys.useIndividualStops ? (customKeys.STOP[codon] || {}) : (customKeys.STOP.ALL || {});
                    sc = stopData.sideChainMass || 0;
                    bb = stopData.backboneMass || 0;
                    p = stopData.protons || 0;
                    n = stopData.neutrons || 0;
                } else {
                    const aaData = customKeys.AMINO_ACIDS[aminoAcid] || {};
                    sc = aaData.sideChainMass || 0;

                                    <h5 className="text-center text-gray-500 text-xs font-semibold">Δ per L8-Block</h5>
                                    <div className="flex justify-between items-center"><span>Δ/L8 (b={b.toFixed(2)}):</span><strong>{deltaPerL8.toFixed(2)}</strong></div>
                                    <div className="flex justify-between items-center"><span>ε₇₄ (Deviation from 74):</span><strong className={isEpsilonSpecial ? 'text-green-600 font-bold' : ''}>{epsilon74.toFixed(2)}</strong></div>
                                </div>
                                 <div className="mt-2 p-1 bg-gray-100 rounded">
                                    <h5 className="text-center text-gray-500 text-xs font-semibold mb-1">Codon Decomposition Analysis (PF 3.6 | SM Fig.6)</h5>
                                    <table className="w-full text-xs text-center">
                                        <thead><tr className="font-bold"><td>Set</td><td>Count</td><td>Side</td><td>Backbone</td><td>Total</td><td>Protons</td><td>Neutrons</td><td>Δ</td></tr></thead>
                                        <tbody>
                                            {Object.entries(decompositionSums).map(([base, data]) => (
                                                <tr key={base}>
                                                    <td>{base}-set</td>
                                                    <td style={highlightStyle(data.count)}>{data.count}</td>
                                                    <td style={highlightStyle(data.sideChainMass)}>{data.sideChainMass}</td>
                                                    <td style={highlightStyle(data.backboneMass)}>{data.backboneMass}</td>
                                                    <td style={highlightStyle(data.fullMass)}>{data.fullMass}</td>
                                                    <td style={highlightStyle(data.protons)}>{data.protons}</td>
                                                    <td style={highlightStyle(data.neutrons)}>{data.neutrons}</td>
                                                    <td style={highlightStyle(data.protons - data.neutrons)}>{data.protons - data.neutrons}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                        <tfoot>
                                            <tr className="font-bold border-t">
                                                <td>Total</td>
                                                <td style={highlightStyle(totalDecomposition.count)}>{totalDecomposition.count}</td>
                                                <td style={highlightStyle(totalDecomposition.sideChainMass)}>{totalDecomposition.sideChainMass}</td>
                                                <td style={highlightStyle(totalDecomposition.backboneMass)}>{totalDecomposition.backboneMass}</td>
                                                <td style={highlightStyle(totalDecomposition.fullMass)}>{totalDecomposition.fullMass}</td>
                                                <td style={highlightStyle(totalDecomposition.protons)}>{totalDecomposition.protons}</td>
                                                <td style={highlightStyle(totalDecomposition.neutrons)}>{totalDecomposition.neutrons}</td>
                                                <td style={highlightStyle(totalDecomposition.protons - totalDecomposition.neutrons)}>{totalDecomposition.protons - totalDecomposition.neutrons}</td>
                                            </tr>
                                        </tfoot>
                                    </table>
                                    <SMAnalysisDisplay totalSums={totalDecomposition} delta={totalDecomposition.protons - totalDecomposition.neutrons} />
                                </div>
                                <AdjacentSetDeltaAnalyzer allDemoSetSums={allDemoSetSums} />
                            </Fragment>
                        )}
                    </div>
                </div>
            );
        };

        const CustomKeysPanel = ({ keys, onKeyChange, activeKeySet, onOpenAAEditor }) => {
            return ( <div className="mt-2 p-2 w-full custom-input-panel"><button className="w-full mb-3 px-3 py-1.5 bg-blue-600 text-white text-xs font-bold rounded hover:bg-blue-700 transition-colors" onClick={onOpenAAEditor}>Open Amino Acid Editor</button><div className="grid grid-cols-1 gap-y-2"><div><h4 className="text-sm font-semibold text-gray-700 mb-1">ATG (Start, Met) Modifier</h4><div className="flex flex-col gap-y-1"><div className="grid grid-cols-2 gap-x-1"><div><label className="block text-xs">Side Chain</label><input type="number" value={keys.START.sideChainMass} onChange={e => onKeyChange('START', null, 'sideChainMass', e.target.value)} /></div><div><label className="block text-xs">Backbone</label><input type="number" value={keys.START.backboneMass ?? ''} placeholder="Std (74)" onChange={e => onKeyChange('START', null, 'backboneMass', e.target.value)} /></div></div><div className="grid grid-cols-2 gap-x-1"><div><label className="block text-xs">Protons</label><input type="number" value={keys.START.protons} onChange={e => onKeyChange('START', null, 'protons', e.target.value)} /></div><div><label className="block text-xs">Neutrons</label><input type="number" value={keys.START.neutrons} onChange={e => onKeyChange('START', null, 'neutrons', e.target.value)} /></div></div></div></div><div><button className="mode-btn center-text mt-1 w-full" onClick={() => onKeyChange('TOGGLE_INDIVIDUAL_STOPS')}>{keys.useIndividualStops ? 'Merge to Single STOP' : 'Split to Individual STOPs'}</button></div>{keys.useIndividualStops ? (['TAA', 'TAG', 'TGA'].map(codon => ( <div key={codon}><h4 className="text-sm font-semibold text-gray-700 mb-1">STOP ({codon}) Modifier</h4><div className="flex flex-col gap-y-1"><div className="grid grid-cols-2 gap-x-1"><div><label className="block text-xs">Side Chain</label><input type="number" value={(keys.STOP[codon] || {}).sideChainMass || 0} onChange={e => onKeyChange('STOP', codon, 'sideChainMass', e.target.value)} /></div><div><label className="block text-xs">Backbone</label><input type="number" value={(keys.STOP[codon] || {}).backboneMass || 0} onChange={e => onKeyChange('STOP', codon, 'backboneMass', e.target.value)} /></div></div><div className="grid grid-cols-2 gap-x-1"><div><label className="block text-xs">Protons</label><input type="number" value={(keys.STOP[codon] || {}).protons || 0} onChange={e => onKeyChange('STOP', codon, 'protons', e.target.value)} /></div><div><label className="block text-xs">Neutrons</label><input type="number" value={(keys.STOP[codon] || {}).neutrons || 0} onChange={e => onKeyChange('STOP', codon, 'neutrons', e.target.value)} /></div></div></div></div>))) : (<div><h4 className="text-sm font-semibold text-gray-700 mb-1">STOP (All) Modifier</h4><div className="flex flex-col gap-y-1"><div className="grid grid-cols-2 gap-x-1"><div><label className="block text-xs">Side Chain</label><input type="number" value={(keys.STOP.ALL || {}).sideChainMass || 0} onChange={e => onKeyChange('STOP', 'ALL', 'sideChainMass', e.target.value)} /></div><div><label className="block text-xs">Backbone</label><input type="number" value={(keys.STOP.ALL || {}).backboneMass || 0} onChange={e => onKeyChange('STOP', 'ALL', 'backboneMass', e.target.value)} /></div></div><div className="grid grid-cols-2 gap-x-1"><div><label className="block text-xs">Protons</label><input type="number" value={(keys.STOP.ALL || {}).protons || 0} onChange={e => onKeyChange('STOP', 'ALL', 'protons', e.target.value)} /></div><div><label className="block text-xs">Neutrons</label><input type="number" value={(keys.STOP.ALL || {}).neutrons || 0} onChange={e => onKeyChange('STOP', 'ALL', 'neutrons', e.target.value)} /></div></div></div></div>)}</div></div> );
        };

        const GeneticCodeMatrixApp = () => {
            const [axisOrder, setAxisOrder] = useState(['C', 'G', 'T', 'A']); const [activeCodeId, setActiveCodeId] = useState('transl_table_1'); const activeGeneticCode = useMemo(() => geneticCodesForRumerExplorer[activeCodeId], [activeCodeId]);
            const orbitsData = useMemo(() => generateRumerOrbitsData(), []); const [selectedCodons, setSelectedCodons] = useState(new Set()); const [activeKeySet, setActiveKeySet] = useState('keySet1');
            const [isInfoModalOpen, setIsInfoModalOpen] = useState(false);
            const [isAAEditorOpen, setIsAAEditorOpen] = useState(false);
            const [customKeys, setCustomKeys] = useState(JSON.parse(JSON.stringify(KEY_SETS.keySet1))); 
            const [activeRefLabel, setActiveRefLabel] = useState('');
            const [activeRightPanelTab, setActiveRightPanelTab] = useState('original');
            const [hoveredPair, setHoveredPair] = useState(null);

            const { sortedAndGroupedCodes, categoryOrder } = useMemo(() => { const categoryOrder = ['standard', 'artificial', 'nuclear', 'mitochondrial', 'bacterial_plastid', 'unofficial']; const sorted = Object.values(geneticCodesForRumerExplorer).sort((a, b) => { const catA = categoryOrder.indexOf(a.type); const catB = categoryOrder.indexOf(b.type); if (catA !== catB) return catA - catB; let idA = a.id.split('_')[2]; let idB = b.id.split('_')[2]; if (idA === '1_pro73') idA = '1.1'; if (idB === '1_pro73') idB = '1.1'; idA = parseFloat(idA.replace('artificial', '0')) || 0; idB = parseFloat(idB.replace('artificial', '0')) || 0; return idA - idB; }); const grouped = {}; sorted.forEach(code => { if (!grouped[code.type]) grouped[code.type] = []; grouped[code.type].push(code); }); return { sortedAndGroupedCodes: grouped, categoryOrder }; }, []);
            
            const allDemoSetSums = useMemo(() => { 
                const sums = {};
                const allStructures = [...NEW_DEMO_STRUCTURE, ...QUARTET_DEMO_STRUCTURE, ...GAMOW_DEMO_STRUCTURE];
                 allStructures.forEach(structure => {
                    if (structure.isOctetContainer) {
                        [structure.octetI, structure.octetII].forEach(section => {
                             section.groups.forEach(group => {
                                group.sets.forEach(set => {
                                    sums[set.id] = calculateSums_New(set.getCodons(), customKeys, activeGeneticCode.table, activeCodeId);
                                    if (set.pair) sums[set.pair.id] = calculateSums_New(set.pair.getCodons(), customKeys, activeGeneticCode.table, activeCodeId);
                                });
                            });
                        });
                    } else {
                         structure.groups.forEach(group => {
                            group.sets.forEach(set => {
                                sums[set.id] = calculateSums_New(set.getCodons(), customKeys, activeGeneticCode.table, activeCodeId); 
                                if (set.pair) sums[set.pair.id] = calculateSums_New(set.pair.getCodons(), customKeys, activeGeneticCode.table, activeCodeId);
                            });
                        });
                    }
                });
                return sums; 
            }, [customKeys, activeGeneticCode, activeCodeId]);

            // When genetic code changes, update amino acid params if defaults are provided
            useEffect(() => {
                if (activeGeneticCode.defaultParams) {
                    setCustomKeys(prev => {
                        const newKeys = JSON.parse(JSON.stringify(prev));
                        // Start with standard to reset any previous code's defaults
                        newKeys.AMINO_ACIDS = JSON.parse(JSON.stringify(STANDARD_AMINO_ACIDS));
                        
                        // Apply new code's specific defaults
                        Object.keys(activeGeneticCode.defaultParams).forEach(aa => {
                            Object.assign(newKeys.AMINO_ACIDS[aa], activeGeneticCode.defaultParams[aa]);
                        });
                        return newKeys;
                    });
                    // Reset Active Key Set ID because we modified it based on code, not button click
                    setActiveKeySet(null); 
                } else {
                    // If no default params, we might want to reset to standard or leave as is?
                    // To keep it "preset" like, let's reset to standard if user picks standard table
                    if (activeGeneticCode.id === 'transl_table_1') {
                         setCustomKeys(prev => {
                            const newKeys = JSON.parse(JSON.stringify(prev));
                            newKeys.AMINO_ACIDS = JSON.parse(JSON.stringify(STANDARD_AMINO_ACIDS));
                            return newKeys;
                        });
                        setActiveKeySet('keySet1');
                    }
                }
            }, [activeGeneticCode]);

            const handleCodonSelect = (codon) => { 
                setSelectedCodons(prev => { const newSet = new Set(prev); if (newSet.has(codon)) newSet.delete(codon); else newSet.add(codon); return newSet; }); 
                setActiveRefLabel('');
            };
            const handleResetSelection = () => { setSelectedCodons(new Set()); setActiveRefLabel(''); };
            const handleDemoSetSelect = (codonSet, refLabel) => { setSelectedCodons(codonSet); setActiveRefLabel(refLabel || ''); };
            const handleSetKeySet = (keySetId) => { 
                if(!keySetId) return; // Handle empty value from select
                setActiveKeySet(keySetId); 
                setCustomKeys(JSON.parse(JSON.stringify(KEY_SETS[keySetId]))); 
            };
            
            // Smart Toggle Logic: Copies ALL values to individual stops if turning ON split mode
            const handleCustomKeyChange = (codonType, codon, param, value) => { 
                setActiveKeySet(null); 
                if(codonType === 'TOGGLE_INDIVIDUAL_STOPS') { 
                    setCustomKeys(prev => {
                        const newUseIndividual = !prev.useIndividualStops;
                        const newKeys = JSON.parse(JSON.stringify(prev));
                        newKeys.useIndividualStops = newUseIndividual;
                        
                        // Smart Copy: If enabling individual stops, copy the current 'ALL' values to each stop
                        if (newUseIndividual) {
                            const source = prev.STOP.ALL || {};
                            ['TAA', 'TAG', 'TGA'].forEach(stop => {
                                newKeys.STOP[stop] = { ...source };
                            });
                        }
                        return newKeys;
                    }); 
                    return; 
                } 
                
                // NEW: Handle empty string as NULL
                const safeNumValue = value === '' ? null : (parseInt(value, 10) || 0); 
                
                setCustomKeys(prev => { 
                    const newKeys = JSON.parse(JSON.stringify(prev)); 
                    if (codonType === 'START') { 
                        newKeys.START[param] = safeNumValue; 
                    } else if (codonType === 'STOP') { 
                        if (!newKeys.STOP[codon]) newKeys.STOP[codon] = {}; 
                        newKeys.STOP[codon][param] = safeNumValue; 
                    } 
                    return newKeys; 
                }); 
            };
            
            const handleAAUpdate = (aa, field, value) => {
                setActiveKeySet(null);
                setCustomKeys(prev => {
                    const newKeys = JSON.parse(JSON.stringify(prev));
                    if(newKeys.AMINO_ACIDS[aa]) {
                        newKeys.AMINO_ACIDS[aa][field] = value;
                    }
                    return newKeys;
                });
            };

            return (
                <div className="flex flex-row h-full">
                    <div className="control-panel">
                        <div className="control-panel-section"><button onClick={() => setIsInfoModalOpen(true)} className="mode-btn mb-2 w-full text-center">Information</button></div>
                        <div className="control-panel-section"><select value={activeCodeId} onChange={e => setActiveCodeId(e.target.value)} className="w-full p-2 border border-gray-300 rounded-md text-xs" style={{fontSize: '0.7rem'}}>{categoryOrder.map(category => (sortedAndGroupedCodes[category] && ( <optgroup key={category} label={category.replace(/_/g, ' ').toUpperCase()}>{sortedAndGroupedCodes[category].map(code => ( <option key={code.id} value={code.id}>{code.name}</option>))} </optgroup>)))}</select></div>
                        
                        <div className="control-panel-section">
                            <h3>Parameter Presets</h3>
                            <div className="flex flex-col gap-1">
                                <button className={`mode-btn ${activeKeySet === 'keySet1' ? 'active' : ''}`} onClick={() => handleSetKeySet('keySet1')}>Key Set 1: Amino Acids Only</button>
                                <button className={`mode-btn ${activeKeySet === 'keySet2' ? 'active' : ''}`} onClick={() => handleSetKeySet('keySet2')}>Key Set 2: Uniform Stops</button>
                                <button className={`mode-btn ${activeKeySet === 'keySet3' ? 'active' : ''}`} onClick={() => handleSetKeySet('keySet3')}>Key Set 3: Variable Stops</button>
                                <button className={`mode-btn ${activeKeySet === 'keySet4' ? 'active' : ''}`} onClick={() => handleSetKeySet('keySet4')}>Key Set 4: Modified Start/Stop</button>
                            </div>
                            <select onChange={(e) => handleSetKeySet(e.target.value)} className="mt-1 w-full select-xs bg-gray-50 text-gray-600" value="">
                                <option value="" disabled>Other Presets...</option>
                                <option value="keySet5">Key Set 5: Variable Stops (26/0)</option>
                                <option value="keySet6">Key Set 6: Uniform Stops (High)</option>
                                <option value="keySet7">Key Set 7: Modified Start/Stop II</option>
                                <option value="keySet8">Key Set 8: Modified Start/Stop III</option>
                            </select>
                        </div>

                        <CustomKeysPanel keys={customKeys} onKeyChange={handleCustomKeyChange} activeKeySet={activeKeySet} onOpenAAEditor={() => setIsAAEditorOpen(true)}/>
                        <OrbitSelector orbitsData={orbitsData} currentOrder={axisOrder.join('')} onOrderSelect={setAxisOrder} />
                    </div>
                    <div className="flex-1 p-4 flex flex-col items-center overflow-auto relative">
                        <MatrixTable axisOrder={axisOrder} thirdPosOrder={axisOrder} selectedCodons={selectedCodons} onCodonSelect={handleCodonSelect} customKeys={customKeys} activeGeneticCode={activeGeneticCode} hoveredPair={hoveredPair} setHoveredPair={setHoveredPair} activeRefLabel={activeRefLabel}/>
                        
                        <Calculator selectedCodons={selectedCodons} onResetSelection={handleResetSelection} customKeys={customKeys} activeGeneticCode={activeGeneticCode} allDemoSetSums={allDemoSetSums} activeRefLabel={activeRefLabel}/>
                    </div>
                    <div className="matrix-instance-properties-panel">
                        <div className="flex border-b-2 border-gray-300 mb-0 items-center justify-between bg-gray-50 rounded-t-lg">
                            <div className="flex">
                                <button className={`px-4 py-2 text-sm font-semibold rounded-t-lg ${activeRightPanelTab === 'original' ? 'bg-blue-500 text-white' : 'text-gray-700 hover:bg-gray-200'}`} onClick={() => setActiveRightPanelTab('original')}>Global</button>
                                <button className={`px-4 py-2 text-sm font-semibold rounded-t-lg ${activeRightPanelTab === 'quartets' ? 'bg-blue-500 text-white' : 'text-gray-700 hover:bg-gray-200'}`} onClick={() => setActiveRightPanelTab('quartets')}>Quartets</button>
                                <button className={`px-4 py-2 text-sm font-semibold rounded-t-lg ${activeRightPanelTab === 'gamow' ? 'bg-blue-500 text-white' : 'text-gray-700 hover:bg-gray-200'}`} onClick={() => setActiveRightPanelTab('gamow')}>Combinatorial</button>
                            </div>
                            <div className="pr-2">
                                <button 
                                    onClick={() => exportData(
                                        activeRightPanelTab === 'original' ? NEW_DEMO_STRUCTURE : 
                                        activeRightPanelTab === 'quartets' ? QUARTET_DEMO_STRUCTURE : GAMOW_DEMO_STRUCTURE, 
                                        customKeys, activeGeneticCode, activeRightPanelTab, allDemoSetSums, selectedCodons
                                    )}
                                    className="export-btn"
                                >
                                    <span>📥</span> CSV
                                </button>
                            </div>
                        </div>
                        {activeRightPanelTab === 'original' && <DemonstrationPanel onSelectSet={handleDemoSetSelect} demoSetSums={allDemoSetSums} demoStructure={NEW_DEMO_STRUCTURE} activeGeneticCode={activeGeneticCode} customKeys={customKeys} activeRightPanelTab={activeRightPanelTab}/>}
                        {activeRightPanelTab === 'quartets' && <DemonstrationPanel onSelectSet={handleDemoSetSelect} demoSetSums={allDemoSetSums} demoStructure={QUARTET_DEMO_STRUCTURE} activeGeneticCode={activeGeneticCode} customKeys={customKeys} activeRightPanelTab={activeRightPanelTab}/>}
                        {activeRightPanelTab === 'gamow' && <DemonstrationPanel onSelectSet={handleDemoSetSelect} demoSetSums={allDemoSetSums} demoStructure={GAMOW_DEMO_STRUCTURE} activeGeneticCode={activeGeneticCode} customKeys={customKeys} activeRightPanelTab={activeRightPanelTab}/>}
                    </div>
                    <InfoModal isOpen={isInfoModalOpen} onClose={() => setIsInfoModalOpen(false)} />
                    <AminoAcidEditorModal isOpen={isAAEditorOpen} onClose={() => setIsAAEditorOpen(false)} aminoAcids={customKeys.AMINO_ACIDS} onUpdate={handleAAUpdate} />
                </div>
            );
        };

        // --- 3. RENDER THE APP ---
        ReactDOM.render(<GeneticCodeMatrixApp />, document.getElementById('root'));

    </script>
</body>
</html>
